spring.application.name=answer-script-app

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/answer_scripts}
spring.datasource.username=${DB_USERNAME:answer_app}
spring.datasource.password=${DB_PASSWORD}

demo.scanner.password=${DEMO_SCANNER_PASSWORD:}
demo.uploader.password=${DEMO_UPLOADER_PASSWORD:}
demo.super-admin.password=${DEMO_SUPER_ADMIN_PASSWORD:}

app.storage.directory=${APP_STORAGE_DIRECTORY:./storage}
app.transcription.instructions-file=${TRANSCRIPTION_INSTRUCTIONS_FILE:./config/transcription-instructions.txt}
app.marking.instructions-file=${MARKING_INSTRUCTIONS_FILE:./config/marking-instructions.txt}
app.rubric-marking.instructions-file=${RUBRIC_MARKING_INSTRUCTIONS_FILE:./config/rubric-marking-instructions.txt}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=80MB

management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always
logging.level.org.springframework=debug


app.exam.reference-data-file=${EXAM_REFERENCE_DATA_FILE:./config/reference-data.json}
