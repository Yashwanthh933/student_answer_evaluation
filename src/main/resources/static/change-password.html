<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change password — Answer Script App</title>
    <style>
        :root {
            color-scheme: light;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #17212b;
            background: #f3f6f8;
        }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
        main { box-sizing: border-box; width: min(34rem, 100%); padding: 2rem; border: 1px solid #dbe3e8; border-radius: 1rem; background: #fff; box-shadow: 0 1rem 3rem #17212b12; }
        .eyebrow { color: #526575; font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
        h1 { margin: .5rem 0; font-size: 1.75rem; }
        p { color: #526575; line-height: 1.5; }
        label { display: block; margin: 1rem 0 .35rem; font-weight: 600; }
        input { box-sizing: border-box; display: block; width: 100%; padding: .65rem; font: inherit; }
        button { margin-top: 1rem; padding: .65rem 1rem; border: 0; border-radius: .5rem; background: #1459a6; color: white; font: inherit; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: .6; cursor: wait; }
        a { color: #1459a6; }
        #status { min-height: 1.5rem; }
        .error { color: #b42318; }
        .success { color: #16734a; }
    </style>
</head>
<body>
<main>
    <p class="eyebrow">Account security</p>
    <h1>Change password</h1>
    <p>Enter your current password and a new password of at least 10 characters. Temporary passwords must be changed before continuing.</p>
    <form id="password-form">
        <label for="current-password">Current password</label>
        <input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required>
        <label for="new-password">New password</label>
        <input id="new-password" name="newPassword" type="password" minlength="10" autocomplete="new-password" required>
        <button id="submit" type="submit">Change password</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <p><a href="/">Return to the app</a></p>
</main>
<script>
    const form = document.querySelector("#password-form");
    const submitButton = document.querySelector("#submit");
    const status = document.querySelector("#status");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submitButton.disabled = true;
        status.className = "";
        status.textContent = "Updating password…";
        try {
            const csrfResponse = await fetch("/csrf", { cache: "no-store" });
            if (!csrfResponse.ok) throw new Error("Could not prepare the secure request.");
            const csrf = await csrfResponse.json();
            const response = await fetch("/api/auth/change-password", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    [csrf.headerName]: csrf.token
                },
                body: JSON.stringify({
                    currentPassword: form.elements.currentPassword.value,
                    newPassword: form.elements.newPassword.value
                })
            });
            if (!response.ok) {
                let detail = `Password change failed (HTTP ${response.status}).`;
                try {
                    const problem = await response.json();
                    detail = problem.detail || problem.message || detail;
                } catch (error) {
                    // Some security responses are plain text.
                }
                throw new Error(detail);
            }
            form.reset();
            status.className = "success";
            status.textContent = "Password changed. You can now return to the app.";
        } catch (error) {
            status.className = "error";
            status.textContent = error.message;
        } finally {
            submitButton.disabled = false;
        }
    });
</script>
</body>
</html>
