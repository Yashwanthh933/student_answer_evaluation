<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Model settings — Answer Script App</title>
    <style>
        :root {
            color-scheme: light;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #17212b;
            background: #f3f6f8;
        }
        body { margin: 0; padding: 2rem 1rem; }
        main {
            width: min(48rem, 100% - 2rem);
            margin: 0 auto;
            padding: 2rem;
            border: 1px solid #dbe3e8;
            border-radius: 1rem;
            background: #fff;
            box-shadow: 0 1rem 3rem #17212b12;
        }
        .eyebrow { color: #526575; font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
        h1 { margin: .5rem 0; font-size: 1.8rem; }
        .intro, .detail { color: #526575; line-height: 1.5; }
        .model { display: grid; grid-template-columns: auto 1fr; gap: .25rem .8rem; padding: 1rem 0; border-top: 1px solid #e8edf0; }
        .model input { grid-row: span 4; margin-top: .25rem; }
        .model label { font-weight: 700; }
        .detail { margin: 0; font-size: .9rem; }
        .unavailable { color: #b42318; font-weight: 700; }
        .available { color: #16734a; font-weight: 700; }
        button { margin-top: 1rem; padding: .7rem 1rem; border: 0; border-radius: .5rem; background: #1459a6; color: white; font: inherit; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: .55; cursor: wait; }
        #message { min-height: 1.5rem; color: #526575; }
        a { color: #1459a6; }
        @media (max-width: 34rem) { main { padding: 1.25rem; } }
    </style>
</head>
<body>
<main>
    <p class="eyebrow">Super Admin · Phase 8</p>
    <h1>Model settings</h1>
    <p class="intro">Choose the model used when you select <strong>Read pages</strong> for a submission.</p>
    <p id="selected" role="status">Loading saved setting…</p>
    <form id="settings-form">
        <div id="models" aria-live="polite"></div>
        <button id="save" type="submit">Save selection</button>
    </form>
    <p id="message" role="status"></p>
    <p><a href="/exams.html">Manage exams</a> · <a href="/submissions.html">Submissions</a> · <a href="/browse.html">Browse</a> · <a href="/users.html">Manage users</a> · <a href="/change-password.html">Change password</a></p>
    <p><a href="/transcription.html">Read submitted scripts</a></p>
    <a href="/">Back to home</a>
</main>
<script>
    const modelList = document.querySelector("#models");
    const selectedText = document.querySelector("#selected");
    const message = document.querySelector("#message");
    const saveButton = document.querySelector("#save");

    function addText(parent, tag, text, className) {
        const element = document.createElement(tag);
        element.textContent = text;
        if (className) element.className = className;
        parent.append(element);
        return element;
    }

    async function loadSettings() {
        const response = await fetch("/api/settings", { cache: "no-store" });
        if (!response.ok) throw new Error(`Could not load model settings (HTTP ${response.status}).`);
        const settings = await response.json();
        modelList.replaceChildren();
        selectedText.textContent = settings.selectedModelId
            ? `Saved selection: ${settings.selectedModelId}`
            : "No model has been selected yet.";

        for (const model of settings.models) {
            const row = document.createElement("div");
            row.className = "model";
            const radio = document.createElement("input");
            radio.type = "radio";
            radio.name = "modelId";
            radio.value = model.id;
            radio.id = `model-${model.id}`;
            radio.checked = model.id === settings.selectedModelId;
            radio.disabled = !model.apiKeyPresent;
            radio.required = model.apiKeyPresent;
            row.append(radio);
            const label = addText(row, "label", `${model.provider} · ${model.id}`, "");
            label.htmlFor = radio.id;
            addText(row, "p", `Model name: ${model.modelName}`, "detail");
            addText(row, "p", `API key (${model.apiKeyEnv}): ${model.apiKeyPresent ? "Present" : "Missing — unavailable"}`,
                `detail ${model.apiKeyPresent ? "available" : "unavailable"}`);
            addText(row, "p", `Can read images: ${model.canReadImages ? "Yes" : "No"}`, "detail");
            modelList.append(row);
        }
        saveButton.disabled = !settings.models.some(model => model.apiKeyPresent);
    }

    document.querySelector("#settings-form").addEventListener("submit", async event => {
        event.preventDefault();
        const chosen = document.querySelector('input[name="modelId"]:checked');
        if (!chosen) {
            message.textContent = "Choose a model with an API key before saving.";
            return;
        }

        saveButton.disabled = true;
        message.textContent = "Saving…";
        try {
            const csrfResponse = await fetch("/csrf", { cache: "no-store" });
            if (!csrfResponse.ok) throw new Error(`Could not get security token (HTTP ${csrfResponse.status}).`);
            const csrf = await csrfResponse.json();
            const response = await fetch("/api/settings", {
                method: "POST",
                headers: { "Content-Type": "application/json", [csrf.headerName]: csrf.token },
                body: JSON.stringify({ modelId: chosen.value })
            });
            if (!response.ok) throw new Error(`Could not save model selection (HTTP ${response.status}).`);
            message.textContent = "Model selection saved.";
            await loadSettings();
        } catch (error) {
            message.textContent = error.message;
        } finally {
            saveButton.disabled = false;
        }
    });

    loadSettings().catch(error => {
        selectedText.textContent = "Could not load model settings.";
        message.textContent = error.message;
    });
</script>
</body>
</html>
