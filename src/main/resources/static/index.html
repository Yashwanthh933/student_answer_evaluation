<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Answer Script App — Health</title>
    <style>
        :root {
            color-scheme: light;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #17212b;
            background: #f3f6f8;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
        }

        main {
            width: min(34rem, calc(100% - 3rem));
            padding: 2rem;
            border: 1px solid #dbe3e8;
            border-radius: 1rem;
            background: #fff;
            box-shadow: 0 1rem 3rem #17212b12;
        }

        .eyebrow {
            color: #526575;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 { margin: 0.5rem 0; font-size: 1.75rem; }
        .intro { color: #526575; line-height: 1.5; }

        dl { margin: 1.5rem 0; }
        dl div {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.85rem 0;
            border-top: 1px solid #e8edf0;
        }
        dt { color: #526575; }
        dd { margin: 0; font-weight: 700; }
        [data-status="UP"] { color: #16734a; }
        [data-status="DOWN"], .error { color: #b42318; }
        a { color: #1459a6; }
        .scanner-link { display: inline-block; margin-top: 0.5rem; font-weight: 700; }
        #message { min-height: 1.25rem; color: #526575; font-size: 0.9rem; }
    </style>
</head>
<body>
<main>
    <p class="eyebrow">Phase 1 · Service health</p>
    <h1>Answer Script App</h1>
    <p class="intro">This page checks that the app is responding and can connect to PostgreSQL.</p>

    <dl aria-live="polite">
        <div><dt>Application</dt><dd id="app-status">Checking</dd></div>
        <div><dt>PostgreSQL</dt><dd id="database-status">Checking</dd></div>
    </dl>
    <p id="message" role="status">Loading health status…</p>
    <a href="/actuator/health">View health details</a>
    <br>
    <a class="scanner-link" href="/upload.html">Scanner sign in</a>
    <br>
    <a class="scanner-link" href="/question-paper.html">Exam Controller sign in</a>
    <br>
    <a class="scanner-link" href="/settings.html">Super Admin sign in</a>
</main>
<script>
    async function showHealth() {
        const appStatus = document.querySelector("#app-status");
        const databaseStatus = document.querySelector("#database-status");
        const message = document.querySelector("#message");

        try {
            const response = await fetch("/actuator/health", { cache: "no-store" });
            const health = await response.json();
            const appState = health.status || "UNKNOWN";
            const databaseState = health.components?.db?.status || "UNKNOWN";

            appStatus.textContent = appState;
            appStatus.dataset.status = appState;
            databaseStatus.textContent = databaseState;
            databaseStatus.dataset.status = databaseState;
            message.textContent = response.ok
                ? "Health check completed."
                : "The health check found a problem. See the details below.";
        } catch (error) {
            appStatus.textContent = "UNAVAILABLE";
            appStatus.dataset.status = "DOWN";
            databaseStatus.textContent = "UNKNOWN";
            databaseStatus.dataset.status = "DOWN";
            message.textContent = "Could not load the health status. Make sure the app is running.";
            message.className = "error";
        }
    }

    showHealth();
</script>
</body>
</html>
